[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vat-rag-agent"
version = "0.1.0"
description = "Auditable P1 retrieval foundation for a bounded China VAT RAG demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-docx>=1.2,<2",
  "llama-index-core>=0.12,<1",
  "chromadb>=1,<2",
  "ollama>=0.5,<1",
  "jieba>=0.42,<1",
  "Flask>=3.1,<4",
  "httpx>=0.28,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
